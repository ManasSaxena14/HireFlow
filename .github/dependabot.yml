version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 breaks Next.js and typescript-eslint, so major versions are taken by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
