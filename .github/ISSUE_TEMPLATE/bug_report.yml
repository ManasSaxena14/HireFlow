name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a recruiter
        2. Open a job's hiring board
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Job seeker board
        - Job feed and alerts
        - Resume check
        - Practice
        - Hiring board
        - Interviews and booking
        - Sign-in and accounts
        - Other
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: If an error message showed a request id (it starts with req_), paste it here.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on macOS
