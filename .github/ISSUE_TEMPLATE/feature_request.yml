name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work.
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who is it for
      options:
        - Job seekers
        - Companies
        - Both
