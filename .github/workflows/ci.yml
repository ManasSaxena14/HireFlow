name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hireflow
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hireflow
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U hireflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hireflow@localhost:5433/hireflow
      TEST_DATABASE_URL: postgresql://hireflow@localhost:5433/hireflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Migrations apply and roll back cleanly
        run: |
          pnpm db:migrate
          pnpm --filter @hireflow/api migrate down 100
          pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
