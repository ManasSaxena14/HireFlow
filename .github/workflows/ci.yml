name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hireflow
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hireflow
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U hireflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hireflow@localhost:5433/hireflow
      TEST_DATABASE_URL: postgresql://hireflow@localhost:5433/hireflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Migrations apply and roll back cleanly
        run: |
          pnpm db:migrate
          pnpm --filter @hireflow/api migrate down 100
          pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @hireflow/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://hireflow@localhost:5433/hireflow_e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
