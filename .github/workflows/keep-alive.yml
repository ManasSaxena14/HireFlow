name: Keep the backend awake

# Render's free plan puts a service to sleep after about 15 minutes with no requests. This runs
# every 12 minutes and asks the light health route, but only inside the awake hours that the
# free plans can pay for. While Render is awake, its worker keeps the Neon database awake too,
# and Neon's free 100 compute hours a month are the real limit. scripts/keep-alive.mjs reads
# Neon's usage each time and works out how many hours a day are still affordable, so the most
# free time is used without Neon stopping the database before the month ends.
on:
  schedule:
    - cron: '*/12 * * * *'
  # Lets you run it by hand from the Actions tab to check the setup.
  workflow_dispatch:

# It reads one script from the repository and makes web requests, nothing more.
permissions:
  contents: read

# A slow wake must never stack up runs on top of each other.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/keep-alive.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Ask the health route inside the affordable hours
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          KEEP_ALIVE_START: ${{ vars.KEEP_ALIVE_START }}
        run: node scripts/keep-alive.mjs
