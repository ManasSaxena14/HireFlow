# Render setup for the API and the worker on the free plan. The web site is hosted separately.
# Fill in the settings marked sync: false in the Render dashboard.
services:
  - type: web
    name: hireflow-api
    runtime: node
    plan: free
    # The same region as the Neon database, so every database call stays close.
    region: singapore
    # Developer tools are needed for the build, even though NODE_ENV is production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build:render
    # Node is started directly, without pnpm in front, which saves time on every wake.
    startCommand: node scripts/start-production.mjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: '2'
      - key: LINK_SECRET
        generateValue: true
      # The Auth URL of the Neon project HireFlow, branch production. It is an address, not a secret.
      - key: NEON_AUTH_BASE_URL
        value: https://ep-restless-night-ao2t4qt0.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
